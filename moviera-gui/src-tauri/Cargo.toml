[package]
name = "moviera"
version = "0.1.0"
description = "MOVIE-RAJA GUI — Tauri 2 desktop shell (Linux) around the moviera-adapter + MovieBox-TUI core"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reused for player detection/launch and the download directory resolution —
# the same MovieBox-TUI implementation the TUI uses.
moviebox-tui = { path = "../backend/moviebox-tui" }

[profile.release]
strip = true
codegen-units = 1
lto = true
panic = "abort"
